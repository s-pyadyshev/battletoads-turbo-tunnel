<!DOCTYPE html>
<html lang="en">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0' />
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta-name="description"
    content="Endless 8-bit Turbo Tunnel action for mobile and desktop. Fully browser-based with no download." />
  <meta-name="keywords"
    content="frog racer,battletoads,turbo tunnel,turbo tunnel remake,battletoads remake,nes remake,html5 battletoads,html5 turbo tunnel" />
  <!-- <meta name="robots" content="index,nofollow" /> -->
  <!-- Schema.org markup for Google+ -->
  <meta itemprop="name" content="Frog Racer 2019">
  <meta itemprop="description"
    content="Endless 8-bit Turbo Tunnel action for mobile and desktop. Fully browser-based with no download.">
  <meta itemprop="image" content="assets/horizsc.png">
  <!-- Twitter Card data -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@eggborne_dev">
  <meta name="twitter:title" content="Frog Racer 2019">
  <meta name="twitter:description"
    content="Endless 8-bit Turbo Tunnel action for mobile and desktop. Fully browser-based with no download.">
  <meta name="twitter:creator" content="@eggborne_dev">
  <meta property="og:description"
    content="Endless 8-bit Turbo Tunnel action for mobile and desktop. Fully browser-based with no download." />
  <title>Frog Racer 2019</title>
  <link href="https://fonts.googleapis.com/css?family=Press+Start+2P" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      padding: 0;
      margin: 0;
      overflow: hidden;
    }

    body {
      text-align: center;
      overflow: hidden;
      background-color: #000000;
      width: 100vw;
      height: 100vh;
      top: 0px;
      font-family: 'Press Start 2P';
      font-weight: normal;
      font-style: normal;
      -webkit-font-smoothing: subpixel-antialiased;
      text-rendering: optimizeLegibility;
      -moz-osx-font-smoothing: auto
    }

    #game-canvas {
      width: 100%;
      height: 100%
    }

    #loadmessage {
      color: #ffffff;
      background-color: #000000;
      position: absolute;
      text-align: center;
      width: 100vw;
      height: 100vh;
      font-size: 10vmin;
    }

    input[type="text"] {
      font-family: inherit;
      text-transform: uppercase;
      text-align: center
    }

    .button {
      display: inline-block;
      cursor: pointer;
      text-align: center;
      outline: none;
      color: #fff;
      background-color: #234424;
      border: none;
      border-radius: 30px;
      box-shadow: 0 8px 16px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19);
    }

    .button:hover {
      background-color: #3e8e41
    }

    .button:active {
      background-color: #3e8e41;
      box-shadow: 0 5px #666;
      transform: translateY(2px);
    }

    .noselect {
      -webkit-touch-callout: none;
      /* iOS Safari */
      -webkit-user-select: none;
      /* Safari */
      -khtml-user-select: none;
      /* Konqueror HTML */
      -moz-user-select: none;
      /* Firefox */
      -ms-user-select: none;
      /* Internet Explorer/Edge */
      user-select: none;
      /* Non-prefixed version, currently
                                        supported by Chrome and Opera */
    }

    @media screen and (orientation:landscape) {
      #nameinput {
        width: 56vh;
        left: calc(50vw - 28vh)
      }

      #namesubmitbutton {
        left: calc(50vw - 16vmin)
      }
    }
  </style>
</head>

    radToDeg = function (radians) {
      deg = radians * (180 / Math.PI);
      if (deg < 0) {
        deg += 360;
      } else if (deg > 359) {
        deg -= 360;
      }
      return radians * (180 / Math.PI);
    };
    function fullscreen() {
      // fullscreen = true
      var el = document.body;
      if (el.webkitRequestFullscreen) {
        el.webkitRequestFullscreen();
      } else {
        el.mozRequestFullScreen();
      }
    }
    function exitFullscreen() {
      // fullscreen = false
      if (document.exitFullScreen) {
        document.exitFullScreen();
      } else if (document.mozCancelFullScreen) {
        document.mozCancelFullScreen();
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      }
    }

        this.buttonMappings = {
          0: {

          },

              },

                if (frog.ducking) {

                }
              }

          },
          3: {
            name: "",
            action: {

                if (gameStarted < 0) {
                  gameStarted = counter;
                }
              },
              up: () => {
                pressingSpace = false;
              }
            }
          },
          4: { name: "", action: null },
          5: { name: "", action: null },
          6: { name: "", action: null },
          7: { name: "", action: null },
          8: { name: "", action: null },
          9: { name: "", action: null },
          10: { name: "", action: null },
          11: { name: "", action: null },
          12: {
            name: "up",
            action: {
              down: () => (pressingUp = true),
              up: () => stopPressing("up")
            }
          },
          13: {
            name: "down",
            action: {
              down: () => (pressingDown = true),
              up: () => stopPressing("down")
            }
          },
          14: {
            name: "left",
            action: {
              down: () => (pressingLeft = true),
              up: () => stopPressing("left")
            }
          },

            action: {

            }

        this.actionButtons = {
          "WALK LEFT": "left",
          "WALK RIGHT": "right",
          JUMP: "up",
          CROUCH: "down",
          "PUNCH/WEAPON": "y",
          KICK: "b",
          "THROW WEAPON": "x"
        };
      }
      currentData() {
        let gamepads = navigator.getGamepads
          ? navigator.getGamepads()
          : navigator.webkitGetGamepads
            ? navigator.webkitGetGamepads
            : [];
        return gamepads[this.index];
      }
      buttonDown(b) {
        return typeof b == "object" ? b.pressed : b == 1.0;
      }
      monitorForPresses() {
        this.currentData().buttons.map((button, i) => {
          if (this.buttonDown(button)) {
            if (!this.currentlyPressedButtons.includes(i)) {
              console.log("pressing button", this.buttonMappings[i].name);
              this.currentlyPressedButtons.push(i);
              if (this.buttonMappings[i].action !== null) {
                this.buttonMappings[i].action.down();
              }
              // pressButton(this.buttonMappings.action, i);
            }
          } else {
            if (this.currentlyPressedButtons.includes(i)) {
              console.log("releasing button", this.buttonMappings[i].name);

              if (this.buttonMappings[i].action !== null) {
                this.buttonMappings[i].action.up();
              }
              // releaseButton(this.buttonMappings[i].action);
              this.currentlyPressedButtons.splice(
                this.currentlyPressedButtons.indexOf(i),
                1
              );
            }
          }
        });
      }
    }

          clearInterval(gamepadPollingInterval);

    function TransitionScreen() {

        this.summoned = true
        this.resetting = resetting
        // progressBar.reached = 0
        // progressBar.marker.x = progressBar.marker.home
        totalDistance = 0
        clearSplashes()
      }
      this.display = function (duration) {
        if (!this.container.visible) {
          this.container.visible = true
          this.exposureTime = duration
        }
        var introTime = Math.ceil(duration / 3)
        if (this.exposureTime < introTime) {
          this.insignia.width -= this.insignia.maxSize / introTime
          this.insignia.height -= this.insignia.maxSize / introTime
          this.insignia.alpha -= (1 / introTime)
          // this.insignia.rotation -= degToRad(360/(introTime-1))
        } else {
          if (this.insignia.width + (this.insignia.maxSize / introTime) < this.insignia.maxSize) {
            this.insignia.width += this.insignia.maxSize / introTime
            this.insignia.height += this.insignia.maxSize / introTime
            this.insignia.alpha += (1 / introTime)
            // this.insignia.rotation += degToRad(360/(introTime-1))
          } else {
            this.insignia.width = this.insignia.height = this.insignia.maxSize
          }
        }
        if (this.resetting) {
          this.exposureTime--
        }


        if (!this.exposureTime) {
          this.container.visible = false
          this.summoned = false
          this.insignia.alpha = 0
          this.insignia.rotation = 0
          // this.insignia.width = this.insignia.height = gameHeight/1000
          if (this.resetting) {
            resetGame()
          }
        }
      }
    }

        } else {
          this.eventMark.width = this.bar.width
          this.eventMark.active = true
          this.eventMark.alpha = 1
        }
      }
      this.updateEventMark = function () {
        if (counter % 4 === 0) {
          this.eventMark.alpha = 0.6
        } else {
          this.eventMark.alpha = 1
        }
        var sinceTriggered = counter - this.eventTriggeredAt
        if (sinceTriggered < 30) {
          if (this.eventMark.width + (pixelSize * 12) < this.bar.width) {
            this.eventMark.width += pixelSize * 12
          } else {
            this.eventMark.width = this.bar.width
            this.eventMark.alpha = 1
          }
        } else {
          var increment = (this.bar.width / currentMaxDuration)
          // if (this.eventMark.width-(this.bar.height/12) > this.bar.height) {
          // 	this.eventMark.width -= this.bar.height/12
          // } else {
          // 	this.eventMark.width = this.bar.height

          // }
          if (this.eventMark.width - increment >= this.bar.height) {
            this.eventMark.width -= increment
          } else {
            this.eventMark.width = this.bar.height
            this.reached = 2
            this.eventMark.active = false
          }
        }


      }

      this.update = function () {
        if (this.reached === 0 && this.marker.x > this.bar.x) {
          this.reached = 1
          this.eventTriggeredAt = counter
          currentEventDuration = currentMaxDuration
          this.cycles++
        }
        if (this.reached === 1) {
          this.marker.x = this.bar.x
          this.updateEventMark()
          if (!bossMode) {
            currentEventDuration--
          }
        } else {
          var inc = this.bar.width / (this.actualWidth)
          this.marker.x += inc * scrollSpeed
          // var diff = (this.actualWidth*(this.cycles+1))-totalDistance
          // this.marker.x = this.marker.home+this.bar.width-(this.bar.width*(diff/this.actualWidth))
          // var inc = this.bar.width/this.actualWidth*12
          // this.marker.x += inc
          if (this.marker.x > this.bar.x + (this.bar.width / 2)) {
            this.marker.x -= this.bar.width
            this.reached = 0
          }
        }
        this.frogIcon.x = this.marker.x
      }
    }

    function rankify(num) {
      var lastNum = num.toString()[num.toString().length - 1]
      var penultNum = num.toString()[num.toString().length - 2]
      var suffix = "th"
      if (lastNum == 1) {
        if (penultNum == 1) { // 11th
          suffix = "th"
        } else {
          suffix = "st" //
        }
      } else if (lastNum == 2) {
        if (penultNum == 1) { // 12th
          suffix = "th"
        } else {
          suffix = "nd"
        }
      } else if (lastNum == 3) {
        if (penultNum == 1) { // 13th
          suffix = "th"
        } else {
          suffix = "rd"
        }
      }
      return num + suffix
    }

    function touchingJoystickArea() {
      var touching = false
      for (var t = 0; t < touches.length; t++) {

          if (!screenVertical) {

              touching = true

      }

        }

        }
      }

      if (!frog.knockedAt && pressingUp) {
        newDirection = "up"
        if (pressingDirections.length < 2 && pressingDirections.indexOf(newDirection) === -1) {
          pressingDirections.push(newDirection)
        }
      }
      if (pressingDown) {
        newDirection = "down"
        if (pressingDirections.length < 2 && pressingDirections.indexOf(newDirection) === -1) {
          pressingDirections.push(newDirection)
        }
      }
      if (pressingLeft) {
        newDirection = "left"
        if (pressingDirections.length < 2 && pressingDirections.indexOf(newDirection) === -1) {
          pressingDirections.push(newDirection)
        }
      }
      if (pressingRight) {
        newDirection = "right"
        if (pressingDirections.length < 2 && pressingDirections.indexOf(newDirection) === -1) {
          pressingDirections.push(newDirection)
        }
      }
    }

    function stopPressing(direction) {
      if (direction === "up") {
        pressingUp = false
      }
      if (direction === "down") {
        pressingDown = false
      }
      if (direction === "left") {
        pressingLeft = false
      }
      if (direction === "right") {
        pressingRight = false
      }
      lastLiftedDirection = direction
      stoppedPressing = counter
      pressingDirections.splice(pressingDirections.indexOf(direction), 1)
    }
    function setInputs() {
      document.onmousedown = function (event) {
        if (event.button === 0) {
          LMBDown = true
          clickedAt = counter
        }
        if (event.button === 2) {
          RMBDown = true
          rightClickedAt = counter
        }
      }
      document.onmousemove = function (event) {
        cursor.x = event.clientX
        cursor.y = event.clientY
      }

      document.onmouseup = function (event) {
        if (event.button === 0) {
          LMBDown = false
        }
        if (event.button === 2) {
          RMBDown = false
        }
      }
      document.onkeydown = function (event) {

        if (event.keyCode == 81) {
          pressingQ = true
          pressedQAt = counter
        };
        if (event.keyCode == 69) {
          pressingE = true
          pressedEAt = counter
        };

        if (pressingDirections.length < 2) {
          if (event.keyCode == 87 || event.keyCode == 38) {
            pressingUp = true
          };
          if (event.keyCode == 83 || event.keyCode == 40) {
            pressingDown = true

          };
          if (pressingRight === false && event.keyCode == 65 || event.keyCode == 37) {
            pressingLeft = true

          };
          if (pressingLeft === false && event.keyCode == 68 || event.keyCode == 39) {
            pressingRight = true

          };
        }
        if (!pressingSpace && event.keyCode == 32) {
          pressingSpace = true
          pressedSpaceAt = counter
          if (gameStarted < 0) {
            gameStarted = counter
          }

        };
        if (!pressingShift && event.keyCode == 16) {
          pressingShift = true
          pressedShiftAt = counter


        };
      };
      document.onkeyup = function (event) {
        if (event.keyCode == 81) {
          pressingQ = false
        };
        if (event.keyCode == 69) {
          pressingE = false
        };
        if (event.keyCode == 87 || event.keyCode == 38) {
          stopPressing("up")
        };
        if (event.keyCode == 83 || event.keyCode == 40) {
          stopPressing("down")
        };
        if (event.keyCode == 65 || event.keyCode == 37) {
          stopPressing("left")
        };
        if (event.keyCode == 68 || event.keyCode == 39) {
          stopPressing("right")
        };
        if (event.keyCode == 32) {

    function Background() {
      this.shifted = 0
      this.bg3 = new PIXI.Container()
      this.bg15 = new PIXI.Container()
      this.bg2 = new PIXI.Container()
      this.bg1 = new PIXI.Container()
      this.bgTopBrains = new PIXI.Container()
      this.bgZero = new PIXI.Container()
      this.bg1.scrolled = this.bgTopBrains.scrolled = this.bg15.scrolled = this.bg2.scrolled = this.bg3.scrolled = this.bgZero.scrolled = 0
      this.topBrains = []
      this.midBrains = []
      this.middleRearEggs = []
      this.rearEggs = []
      this.floors = []
      this.frontEggs = []
      this.floorContainer = new PIXI.Container()
      var upper = new PIXI.Sprite(topBrainsText)
      var mid = new PIXI.Sprite(midBrainsText)
      var floor = new PIXI.Sprite(midGroundText)
      this.topBrainHW = upper.height / upper.width
      this.topBrainHeight = viewHeight * (upper.height / pixelHeight)
      this.topBrainWidth = this.topBrainHeight / this.topBrainHW
      this.midBrainHW = mid.height / mid.width
      this.midBrainHeight = viewHeight * (mid.height / pixelHeight)
      this.midBrainWidth = this.midBrainHeight / this.midBrainHW
      this.floorHW = floor.height / floor.width
      this.floorHeight = viewHeight * (floor.height / pixelHeight)
      this.floorWidth = this.floorHeight / this.floorHW
      this.brainsPerWidth = 1 + Math.ceil(window.innerWidth / this.topBrainWidth)
      this.floorsPerWidth = 1 + Math.ceil(window.innerWidth / (this.floorWidth))
      this.floorHeight = viewHeight - (this.topBrainHeight + this.midBrainHeight)
      this.floorBreadth = viewHeight * (28 / pixelHeight)
      this.finishedGap = -99
      this.producingFloor = true
      stage.addChild(this.bgTopBrains)
      stage.addChild(this.bg3)
      stage.addChild(this.bg2)
      stage.addChild(this.bg15)
      stage.addChild(this.bg1)

      stage.addChild(this.bgZero)

      highestFloor = viewHeight * (118 / pixelHeight)
      lowestFloor = viewHeight * (152 / pixelHeight)
      this.floorsToRestore = 0

      this.destruct = function () {
        this.bgTopBrains.destroy()
        this.bg3.destroy()
        this.bg2.destroy()
        this.bg15.destroy()
        this.bg1.destroy()
        this.bgZero.destroy()

      }

      this.shiftTopContents = function () {
        var leftMost = this.topBrains[0]
        this.topBrains.splice(0, 1)
        this.topBrains.push(leftMost)
        leftMost.x += (this.brainsPerWidth * this.topBrainWidth)
      }
      this.shiftMidContents = function () {
        var leftMost = this.midBrains[0]
        this.midBrains.splice(0, 1)
        this.midBrains.push(leftMost)
        leftMost.x += (this.brainsPerWidth * this.midBrainWidth)
      }
      this.shiftRearMidContents = function () {
        var leftMost = this.middleRearEggs[0]
        this.middleRearEggs.splice(0, 1)
        this.middleRearEggs.push(leftMost)
        leftMost.x += (this.brainsPerWidth * this.midBrainWidth)
      }
      this.shiftRearContents = function () {
        var leftMost = this.rearEggs[0]
        this.rearEggs.splice(0, 1)
        this.rearEggs.push(leftMost)
        leftMost.x += (this.brainsPerWidth * this.midBrainWidth)
      }
      this.shiftFloor = function () {
        this.shifted++
        var leftMost = this.floors[0]
        this.floors.splice(0, 1)
        this.floors.push(leftMost)
        // leftMost.x += (this.floorsPerWidth*this.floorWidth)
        leftMost.x += (this.floorsPerWidth * this.floorWidth)
        if (frog.vehicle === "rocketPlane") {
          currentGapSize++
        }
        if (currentGapSize) {
          currentGapSize--
          if (currentGapSize > 0) {
            leftMost.texture = midEggsText
          } else {
            leftMost.texture = midGroundLeftEndText
            this.gapBlocking = false
            this.finishedGap = counter
          }

        } else {
          if (this.floorsToRestore && leftMost.texture !== midGroundText) {
            if (this.makingGap) {
              this.makingGap = false
            }
            leftMost.texture = midGroundText
            this.floorsToRestore--
            if (this.floorsToRestore === 0) {
              nextGap.min = 0
              nextGap.max = 0
            }
          }
        }
      }
      this.shiftForeground = function () {
        var leftMost = this.frontEggs[0]
        this.frontEggs.splice(0, 1)
        this.frontEggs.push(leftMost)
        leftMost.x += (this.brainsPerWidth * this.midBrainWidth)
      }
      this.createTop = function (posX) {
        var topBrain = new PIXI.Sprite(topBrainsText)
        topBrain.width = this.topBrainWidth
        topBrain.height = this.topBrainHeight
        topBrain.x = posX
        topBrain.y = 0
        this.topBrains.push(topBrain)
        this.bgTopBrains.addChild(topBrain)
      }
      this.createMiddle = function (posX) {
        var midBrain = preparedSprite(midBrainsText)
        midBrain.anchor.y = 0
        midBrain.x = posX
        midBrain.y = this.topBrainHeight
        // midBrain.alpha = 0
        this.midBrains.push(midBrain)
        this.bg3.addChild(midBrain)
      }

      this.createMidGround = function (posX) {
        var ground = preparedSprite(midGroundText)
        ground.anchor.y = 0
        ground.x = posX
        ground.y = this.topBrainHeight + (ground.height)
        this.floors.push(ground)
        this.bg1.addChild(ground)
      }
      this.createRear = function (posX) {
        var rearEgg = preparedSprite(rearEggsText)
        rearEgg.anchor.y = 0
        rearEgg.x = posX
        rearEgg.y = this.topBrainHeight + (rearEgg.height)
        this.rearEggs.push(rearEgg)
        this.bg2.addChild(rearEgg)
      }
      this.createMiddleRear = function (posX) {
        var middleRearEgg = preparedSprite(midEggs2Text)
        middleRearEgg.anchor.y = 0
        middleRearEgg.x = posX
        middleRearEgg.y = this.topBrainHeight + (middleRearEgg.height)
        this.middleRearEggs.push(middleRearEgg)
        this.bg15.addChild(middleRearEgg)
      }
      this.createForeground = function (posX) {
        var frontEgg = preparedSprite(frontEggsText)
        frontEgg.anchor.y = 0
        frontEgg.x = posX
        frontEgg.y = this.topBrainHeight + (frontEgg.height)
        this.frontEggs.push(frontEgg)
        this.bgZero.addChild(frontEgg)
      }
      this.moveLeft = function (amount) {
        this.bgZero.x -= amount * 1.12
        this.bgZero.scrolled += amount * 1.12
        this.bg1.x -= amount
        this.bg1.scrolled += amount
        this.bgTopBrains.x -= amount
        this.bgTopBrains.scrolled += amount

        totalDistance += amount
        // if (nextGap.max > 0 || counter < this.finishedGap+400) {		
        this.bg2.x -= amount * 0.75
        this.bg2.scrolled += amount * 0.75
        this.bg15.x -= amount * 0.9
        this.bg15.scrolled += amount * 0.9
        // }
        this.bg3.x -= amount * 0.6
        this.bg3.scrolled += amount * 0.6
        if (this.bgZero.scrolled > this.floorWidth) {
          this.shiftForeground()
          this.bgZero.scrolled = this.bgZero.scrolled - this.floorWidth
        }
        if (this.bgTopBrains.scrolled > this.topBrainWidth) {
          this.shiftTopContents()
          this.bgTopBrains.scrolled = this.bgTopBrains.scrolled - this.topBrainWidth
        }

        if (this.bg1.scrolled > this.floorWidth) {
          this.shiftFloor()
          this.bg1.scrolled = this.bg1.scrolled - this.floorWidth

        }
        if (this.bg15.scrolled > this.floorWidth) {
          this.shiftRearMidContents()
          this.bg15.scrolled = this.bg15.scrolled - this.midBrainWidth
        }
        if (this.bg2.scrolled >= this.midBrainWidth) {
          this.shiftRearContents()
          this.bg2.scrolled = this.bg2.scrolled - this.midBrainWidth
        }
        if (this.bg3.scrolled >= this.midBrainWidth) {
          this.shiftMidContents()
          this.bg3.scrolled = this.bg3.scrolled - this.midBrainWidth
        }
      }
      this.makingGap = false
      this.startGap = function (size) {
        this.makingGap = true
        this.gapBlocking = true
        currentGapSize = size
        this.floorsToRestore = (size - 1) + 2
        var rightMost = rightMostInArray(this.floors)
        rightMost.texture = midGroundRightEndText
        nextGap.min = Math.round(rightMost.x + rightMost.width * 0.72)
        nextGap.max = nextGap.min + Math.round(((this.floorsToRestore - 1) * rightMost.width) - (rightMost.width * 0.72))
      }
      gameHeight = this.topBrainHeight + this.midBrainHeight + this.floorHeight
    }
    function preparedSprite(texture) {
      var sprite = new PIXI.Sprite(texture)
      sprites++
      sprite.anchor.y = 1
      spriteHW = sprite.height / sprite.width
      sprite.height = viewHeight * (sprite.height / pixelHeight)
      if (texture === alienHeadClosedText || texture === alienHeadOpenText) {
        console.log('sprite.height', sprite.height);
        console.log('pixelHeight', pixelHeight);
        sprite.height = (sprite.height * pixelHeight)
      }
      sprite.width = sprite.height / spriteHW
      return sprite
    }
    function tiledSprite(texture) {
      var sprite = new PIXI.extras.TilingSprite(texture, texture.width, texture.height)
      sprites++
      sprite.anchor.y = 1
      spriteHW = sprite.height / sprite.width
      sprite.height = viewHeight * (sprite.height / pixelHeight)
      sprite.width = sprite.height / spriteHW
      return sprite
    }
    function usedSpriteAvailable(texture) {
      usedSprite = undefined
      for (var s = 0; s < deadSprites.length; s++) {
        var sprite = deadSprites[s]
        if (!usedSprite && sprite.texture === texture) {
          usedSprite = sprite
          deadSprites.splice(s, 1)
        }
      }
      return usedSprite
    }

        && frog.shadow.y <= this.sprite.y && frog.shadow.y >= this.sprite.y - (this.baseDetectionArea)) {

        if (this.sprite.texture === pillarText && frog.elevation < this.sprite.height * 0.9) {
          frog.sprite.x -= frog.velocity.x

    Pillar.prototype.correctZLevel = function () {
      if ((this.sprite.texture === highRampText && !frog.offGround) || (this.sprite.texture === highWidePillarText && frog.ducking) || frog.shadow.y < this.sprite.y - (this.baseDetectionArea)) {
        if (stage.children.indexOf(this.sprite) < stage.children.indexOf(frog.sprite)) {
          stage.removeChild(this.sprite)
          stage.addChildAt(this.sprite, stage.children.indexOf(frog.sprite) + 1)
        }
      } else {
        if (stage.children.indexOf(this.sprite) > stage.children.indexOf(frog.sprite)) {
          stage.removeChild(this.sprite)
          stage.addChildAt(this.sprite, stage.children.indexOf(frog.sprite) - 1)
        }
      }

    Pillar.prototype.flash = function () {
      var sinceDropped = counter - this.spawnedAt
      if (sinceDropped < this.warningTime) {
        if (sinceDropped > 0 && sinceDropped % this.flashSpeed === 0) {
          if (this.sprite.alpha === 1) {
            this.sprite.alpha = 0.1
            if (this.shadow) {
              this.shadow.alpha = 0.1
            }
          } else {
            this.sprite.alpha = 1
            if (this.shadow) {
              this.shadow.alpha = 1
            }
          }
        }
      } else {
        this.sprite.alpha = 1
        if (this.shadow) {
          this.shadow.alpha = 1
        }
        this.droppedAt = counter
        if (this.sprite.texture === rampText) {
          background.startGap(randomInt(2, maxGapLength))
          gapPlanned = false
          lastGap = counter
        }
        if (this.sprite.texture === highRampText) {
          background.startGap(3, maxGapLength + 1)
          gapPlanned = false
          lastGap = counter
        }
        pillarsPending--
      }

    function Splash(posX, posY, size, speed, texture, particles, alphaFactor) {
      this.container = new PIXI.Container()
      this.speed = speed

      for (var p = 0; p < particles; p++) {
        var part = new PIXI.Sprite(texture)
        part.anchor.set = 0.5
        part.x = posX
        part.y = posY
        part.flyAngle = degToRad(360 / particles) * p
        part.width = part.height = size
        part.alphaFactor = 0.04
        // var startSpot = pointAtAngle(part.x,part.y,part.flyAngle,frog.sprite.height/56)
        // part.x = startSpot.x
        // part.y = startSpot.y

        this.container.addChild(part)
        part.fly = function () {
          var flySpeed = speed
          if (this.texture === starText) {
            flySpeed = speed + (randomInt(-2, 2) * (frog.sprite.height / 100))
          }
          var newSpot = pointAtAngle(this.x, this.y, this.flyAngle, flySpeed)
          this.x = newSpot.x
          this.y = newSpot.y
          if (this.texture === starText) {
            this.rotation += degToRad(6)
          }
          this.alpha -= this.alphaFactor
          if (this.alpha < 0) {
            this.alpha = 0
          }

        }
      }
      this.explode = function () {
        for (var p = 0; p < this.container.children.length; p++) {
          var part = this.container.children[p]
          part.fly(this.speed)
          if (p === this.container.children.length - 1 && part.alpha <= 0) {
            splashes.splice(splashes.indexOf(this), 1)
            stage.removeChild(this.container)
            return
          }
        }
      }
      stage.addChild(this.container)
      splashes.push(this)
    }

    function rightMostInArray(arr) {
      var furthest = 0
      var winner = undefined
      for (var e = 0; e < arr.length; e++) {
        var entry = arr[e]
        if (entry.x > furthest) {
          furthest = entry.x
          winner = entry
        }
      }
      return winner

    function GameMessage() {
      if (screenVertical) {
        messageStyle = messageVertStyle
      } else {

      }
      this.legend = new PIXI.Text(currentMessage, messageStyle)
      this.legend.anchor.set(0.5)
      this.legend.homeX = Math.round(viewWidth / 2)
      this.legend.x = Math.round(this.legend.homeX + (viewWidth / 2) + (this.legend.width / 2))
      this.legend.skew.x = -0.5
      this.legend.maxSkew = -this.legend.skew.x
      this.activated = false
      this.landed = false
      this.legend.y = Math.round(viewHeight / 3)
      this.scrollOnscreen = function () {
        lastScrollSpeed = scrollUnit * 16
        if (this.legend.text !== currentMessage) {
          this.legend.text = currentMessage
        }
        if (!this.landed) {
          if (this.legend.x - lastScrollSpeed >= this.legend.homeX) {
            this.legend.x -= lastScrollSpeed
          } else {
            this.legend.x = this.legend.homeX
            this.landed = true
          }
        } else {
          if (messageDisplayDuration) {
            if (messageDisplayDuration > 50) {
              this.legend.skew.x += 0.5 / 10
              // this.legend.scale.x += 0.2/10
              // this.legend.scale.y += 0.2/10
            } else if (!frog.dead && messageDisplayDuration <= 10) {
              this.legend.skew.x -= 0.5 / 10
              // this.legend.scale.x -= 0.2/10
              // this.legend.scale.y -= 0.2/10
            }
            messageDisplayDuration--
          } else {
            if (!frog.dead) {
              if (this.legend.x - lastScrollSpeed >= -this.legend.width / 2) {
                this.legend.x -= lastScrollSpeed
              } else {
                this.reset()
              }
            }
          }
        }
      }
      this.reset = function () {
        this.landed = false
        this.legend.y = Math.round(viewHeight / 3)
        this.activated = false
        this.legend.x = this.legend.homeX + (viewWidth / 2) + (this.legend.width / 2)
        this.legend.skew.x = -0.5
        gameMessage.legend.text = ""
        messageDisplayDuration = 60
      }
      stage.addChild(this.legend)

        this.topHalf.x -= scrollSpeed

          for (var s = 0; s < this.topHalf.children.length; s++) {

            segment.scale.x *= -1
          }
          for (var b = 0; b < this.bottomHalf.children.length; b++) {

          }

        this.topHalf.y += this.moveTop

        this.gapTop += this.moveTop
        this.gapBottom += this.moveBottom
        if (this.movetop > 0 && this.moveBottom > 0 || this.moveTop < 0 && this.moveBottom < 0) {
          // same direction
          if (this.topHalf.y < -this.topHalf.height) {
            this.moveTop *= -1
            // this.moveBottom *= -1
            this.topHalf.y = -this.topHalf.height
          }
          if (this.gapBottom > (pixelHeight * pixelSize)) {
            // this.moveTop *= -1
            this.moveBottom *= -1
            this.bottomHalf.y = (pixelHeight * pixelSize)
          }
        } else {
          // different directions
          if (this.moveTop && this.moveBottom) {
            // both moving
            if (this.moveTop < 0 && this.moveBottom > 0) {
              // moving apart
              if (this.topHalf.y < -this.topHalf.height) {
                // top offscreen
                this.moveTop *= -1
                this.topHalf.y = -this.topHalf.height
              }
              if (this.bottomHalf.y > (pixelHeight * pixelSize)) {
                // bottom offscreen
                this.moveBottom *= -1
                this.bottomHalf.y = (pixelHeight * pixelSize)
              }

            } else if (this.moveTop > 0 && this.moveBottom < 0) {
              // moving together
              if (this.gapBottom - this.gapTop < this.minGap) {
                // too close
                this.moveTop *= -1
                this.moveBottom *= -1
                this.topHalf.y += this.moveTop
                this.bottomHalf.y += this.moveBottom
              }
            }
          } else {
            // one or none moving
            if (!(this.moveTop && this.moveBottom)) {
              // one moving
              if (this.bottomHalf.y - (this.topHalf.y + this.topHalf.height) < this.minGap) {
                // too close

                  // top moving
                  this.moveTop *= -1
                  // this.topHalf.y = this.bottomHalf.y-frog.sprite.height
                }
                if (this.moveBottom < 0) {
                  // bottom moving
                  this.moveBottom *= -1
                  // this.bottomHalf.y = this.topHalf.y+frog.sprite.height
                }


              }
            }
          }
        }

        }
      }

            alienHead.descending = false
          } else {
            // alienHead.summon(600)
          }
        }

    function advancePillars() {
      for (var p = 0; p < pillars.length; p++) {
        var pillar = pillars[p]
        if (!pillar.droppedAt) {
          pillar.flash()
        } else {

          if (!pillar.droppedBy) {
            if (frogCollision && frog.sprite.y < gameHeight + (frog.sprite.height / 2) && !frog.dead) {
              // if (pillar.sprite.texture === rampText || pillar.sprite.texture === highRampText) {
              pillar.checkForFrog()
              // }

            }
            pillar.correctZLevel()
            pillar.advance()
            if (pillar.screenPosition().x <= -pillar.sprite.width) {
              // if (!usedSpriteAvailable(pillar.sprite.texture)) {
              deadSprites.push(pillar.sprite)
              // }
              pillars.splice(p, 1)
              stage.removeChild(pillar.sprite)
              if (pillar.shadow) {
                stage.removeChild(pillar.shadow)
              }
              p--
            }
          } else {
            if (pillar.sprite.y === pillar.homeY) {
              pillar.advance()
              if (frogCollision && !frog.dead) {
                pillar.checkForFrog()
              }
              pillar.correctZLevel()
            }
          }
        }
      }
    }
    function advanceMines() {
      for (var m = 0; m < mines.length; m++) {
        var mine = mines[m]
        if (true) {
          if (!mine.killedFrog) {
            mine.advance()
            mine.correctZLevel()
            if (frogCollision) {
              mine.checkForFrog()
            }
          } else {
            var sinceHit = counter - mine.killedFrog
            if (sinceHit === 1) {
              mine.sprite.alpha = 0
              mine.explosion.visible = true
              mine.explosion.x = mine.sprite.x
              mine.explosion.y = mine.sprite.y
              mine.explosion.origScale = mine.explosion.scale.x
              mine.explosion.scale.x *= 0.4
              mine.explosion.scale.y *= 0.4
            } else if (sinceHit < 15) {
              if (Math.abs(mine.explosion.scale.x * 1.1) < mine.explosion.origScale) {
                mine.explosion.scale.x *= 1.5
                mine.explosion.scale.y *= 1.5
              } else {
                mine.explosion.scale.x = mine.explosion.scale.y = mine.explosion.origScale
              }
              if (sinceHit % 3 === 0) {
                mine.explosion.tint = 0xff0000
                // mine.explosion.scale.x *= -1
              } else {
                mine.explosion.tint = 0xffffff
              }
            } else {
              mine.explosion.scale.x -= 0.5
              mine.explosion.scale.y -= 0.5
              if (mine.explosion.scale.x < 0) {
                mine.explosion.visible = false
                mine.sprite.visible = false
              }

            }
          }
          if (!mine.sprite.visible) {
            mines.splice(m, 1)
            // m--
            // stage.removeChild(mine.sprite)
            mine.sprite.destroy()
            mine.shadow.destroy()
            mine.explosion.destroy()
            // stage.removeChild(mine.shadow)
          }
        }

      }
    }
    function advanceRats() {
      for (var r = 0; r < rocketRats.length; r++) {
        var rat = rocketRats[r]
        rat.advance()
        if (rat.droppedPillar) {
          if (rat.pillar.sprite.y + (pixelSize * 4) < rat.pillar.homeY) {
            rat.pillar.sprite.y += pixelSize * 4
          } else {
            rat.pillar.sprite.y = rat.pillar.homeY
          }
        }

        if (!rat.sprite.visible) {
          rocketRats.splice(r, 1)
          // r--
          rat.sprite.destroy()
          rat.shadow.destroy()
        }
      }
    }

        info.text = "Time: " + Math.floor(counter / 100) + " s. / " + "Distance: " + feet + " m."

        if (debugMode) {

            + " gravity: " + frogGravity

          // + " \rfeet: " + (distanceInFeet(totalDistance))
        }

        if (currentEventDuration <= 0 && totalDistance > nextSpecial) {
          if (totalDistance < nextSpecial + specialLength) {
            if (currentSpecial === "rat") {
              if (counter % 45 === 0) {
                new RocketRat(randomInt(0, 2))
              }
            } else if (currentSpecial === "mine") {
              var sinceLast = counter - lastMine
              if (sinceLast > randomInt(100, 200)) {
                new Mine()
              }

          } else {
            specialInterval = viewWidth * (48 + randomInt(-10, 10))

          }

        // if (exclamationMark.triggered) {

        if (tyson.activated) {

          } else {

              tyson.enter()
            } else if (!frog.dead && !tyson.tauntStartedAt && !tyson.currentPunch) {
              tyson.patrol()
            }
            if (tyson.tauntStartedAt) {
              tyson.taunt(100)
            } else {

              if (tyson.currentPunch) {
                tyson.checkForFrog()
                if (tyson.landedPunchAt === counter) {

                if (counter - tyson.punchedAt >= tyson.currentPunch.duration) {

                  if (tyson.sprite.scale.x < 0) {

              } else {

                if (!frog.dead) {
                  tyson.switchGuard(40)
                }

            }
            currentEventDuration--
          }
        }
        if (alienHead.activated) {
          alienHead.attack();

          if (!currentEventDuration) {
            events.length = 0;
          }
        }
        enemies.map(enemy => {
          enemy.advance();
          if (!frog.dead) {

        })


        if (counter === playerInitiatedAt) {

        if (!frog.dead) {

          if (!frog.offGround) {

              }

              } else if (frog.sprite.y > duckY) {

          }

          }

          }

                } else {
                  addHighBar()
                }

              }

              if (rando <= 2) {

              } else if (rando === 3) {
                addHighRamp()
              }
